<svg width="830" height="460" viewBox="0 0 830 460" xmlns="http://www.w3.org/2000/svg"
     font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="22">
<style>
  text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
  text.th, text.th tspan { font-family: 'Noto Sans Thai', 'Sarabun', Inter, 'Segoe UI', system-ui, sans-serif; }
  text.th tspan.c { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
</style>
  <defs>
    <marker id="tr-orange" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#e67e22"/>
    </marker>
    <marker id="tr-blue" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2980b9"/>
    </marker>
  </defs>

  <!-- row 1: full expression, leftmost * binds first -->
  <rect x="46" y="26" width="128" height="38" rx="8" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
  <text x="70"  y="53" text-anchor="middle" fill="#7e5109" font-weight="bold">2</text>
  <text x="110" y="53" text-anchor="middle" fill="#e67e22" font-weight="bold">*</text>
  <text x="152" y="53" text-anchor="middle" fill="#7e5109" font-weight="bold">20</text>
  <text x="196" y="53" text-anchor="middle" fill="#95a5a6">+</text>
  <text x="240" y="53" text-anchor="middle" fill="#2c3e50">10</text>
  <text x="282" y="53" text-anchor="middle" fill="#95a5a6">*</text>
  <text x="324" y="53" text-anchor="middle" fill="#2c3e50">15</text>
  <text x="366" y="53" text-anchor="middle" fill="#95a5a6">/</text>
  <text x="406" y="53" text-anchor="middle" fill="#2c3e50">5</text>
  <text class="th" x="490" y="52" fill="#e67e22" font-size="15"><tspan class="c">*</tspan> จับคู่ซ้าย → ขวา → ตัวซ้ายสุดก่อน</text>

  <!-- arrow: * (x=110) down onto the 40 it produces -->
  <line x1="110" y1="68" x2="110" y2="104" stroke="#e67e22" stroke-width="2" marker-end="url(#tr-orange)"/>

  <!-- row 2: 2*20 = 40, the other * is next -->
  <rect x="170" y="106" width="132" height="38" rx="8" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
  <circle cx="32" cy="125" r="13" fill="#e67e22"/>
  <text x="32" y="132" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">1</text>
  <text x="110" y="133" text-anchor="middle" fill="#7e5109" font-weight="bold">40</text>
  <text x="152" y="133" text-anchor="middle" fill="#95a5a6">+</text>
  <text x="194" y="133" text-anchor="middle" fill="#7e5109" font-weight="bold">10</text>
  <text x="236" y="133" text-anchor="middle" fill="#e67e22" font-weight="bold">*</text>
  <text x="278" y="133" text-anchor="middle" fill="#7e5109" font-weight="bold">15</text>
  <text x="320" y="133" text-anchor="middle" fill="#95a5a6">/</text>
  <text x="360" y="133" text-anchor="middle" fill="#2c3e50">5</text>
  <text class="th" x="490" y="132" fill="#e67e22" font-size="15"><tspan class="c">*</tspan> อีกตัว → ทำก่อน <tspan class="c">+</tspan> (ระดับสูงกว่า)</text>

  <!-- arrow: * (x=236) down onto the 150 it produces -->
  <line x1="236" y1="148" x2="236" y2="184" stroke="#e67e22" stroke-width="2" marker-end="url(#tr-orange)"/>

  <!-- row 3: 10*15 = 150, then / -->
  <rect x="212" y="186" width="138" height="38" rx="8" fill="#fef5e7" stroke="#e67e22" stroke-width="2"/>
  <circle cx="32" cy="205" r="13" fill="#e67e22"/>
  <text x="32" y="212" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">2</text>
  <text x="144" y="213" text-anchor="middle" fill="#2c3e50">40</text>
  <text x="190" y="213" text-anchor="middle" fill="#95a5a6">+</text>
  <text x="236" y="213" text-anchor="middle" fill="#7e5109" font-weight="bold">150</text>
  <text x="284" y="213" text-anchor="middle" fill="#e67e22" font-weight="bold">/</text>
  <text x="326" y="213" text-anchor="middle" fill="#7e5109" font-weight="bold">5</text>
  <text class="th" x="490" y="212" fill="#e67e22" font-size="15"><tspan class="c">/</tspan> ระดับเดียวกับ <tspan class="c">*</tspan> → ทำต่อ (ซ้าย → ขวา)</text>

  <!-- arrow: / (x=284) down onto the 30.0 it produces -->
  <line x1="284" y1="228" x2="284" y2="264" stroke="#e67e22" stroke-width="2" marker-end="url(#tr-orange)"/>

  <!-- row 4: 150/5 = 30.0, then + last -->
  <rect x="164" y="266" width="152" height="38" rx="8" fill="#eaf2fb" stroke="#2980b9" stroke-width="2"/>
  <circle cx="32" cy="285" r="13" fill="#e67e22"/>
  <text x="32" y="292" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">3</text>
  <text x="192" y="293" text-anchor="middle" fill="#1a5276" font-weight="bold">40</text>
  <text x="238" y="293" text-anchor="middle" fill="#2980b9" font-weight="bold">+</text>
  <text x="284" y="293" text-anchor="middle" fill="#1a5276" font-weight="bold">30.0</text>
  <text class="th" x="490" y="292" fill="#2980b9" font-size="15"><tspan class="c">+</tspan> ระดับต่ำสุด → ทำทีหลังสุด</text>

  <!-- arrow: + (x=238) down onto the 70.0 it produces -->
  <line x1="238" y1="308" x2="238" y2="344" stroke="#2980b9" stroke-width="2" marker-end="url(#tr-blue)"/>

  <!-- row 5: result -->
  <rect x="178" y="346" width="120" height="40" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="32" cy="366" r="13" fill="#27ae60"/>
  <text x="32" y="373" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">4</text>
  <text x="238" y="374" text-anchor="middle" fill="#145a32" font-weight="bold">70.0</text>
  <text class="th" x="330" y="373" fill="#27ae60" font-size="15">มีการหาร → ได้ <tspan class="c">float</tspan> ผลลัพธ์จึงเป็น <tspan class="c">70.0</tspan></text>

  <!-- footer: parentheses make it explicit -->
  <line x1="46" y1="410" x2="784" y2="410" stroke="#e5e8ea" stroke-width="1.5"/>
  <text class="th" x="46" y="440" fill="#5d6d7e" font-size="15">เขียนให้ชัดด้วยวงเล็บ: <tspan class="c" fill="#2c3e50" font-weight="bold">(2 * 20) + ((10 * 15) / 5)</tspan> — ผลเท่ากัน แต่ผู้อ่านไม่ต้องเดา</text>
</svg>
